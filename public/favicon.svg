<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <rect width="16" height="16" rx="2" fill="#090d16"/>
  <!-- Outer Golden Shield Frame -->
  <rect x="3" y="1" width="10" height="1" fill="#f59e0b"/>
  <rect x="2" y="2" width="1" height="8" fill="#f59e0b"/>
  <rect x="13" y="2" width="1" height="8" fill="#f59e0b"/>
  <rect x="3" y="10" width="1" height="2" fill="#f59e0b"/>
  <rect x="12" y="10" width="1" height="2" fill="#f59e0b"/>
  <rect x="4" y="12" width="2" height="1" fill="#f59e0b"/>
  <rect x="10" y="12" width="2" height="1" fill="#f59e0b"/>
  <rect x="6" y="13" width="1" height="1" fill="#f59e0b"/>
  <rect x="9" y="13" width="1" height="1" fill="#f59e0b"/>
  <rect x="7" y="14" width="2" height="1" fill="#f59e0b"/>
  <!-- Inner Shield Fill -->
  <rect x="3" y="2" width="10" height="8" fill="#1a2336"/>
  <rect x="4" y="10" width="8" height="2" fill="#1a2336"/>
  <rect x="6" y="12" width="4" height="1" fill="#1a2336"/>
  <rect x="7" y="13" width="2" height="1" fill="#1a2336"/>
