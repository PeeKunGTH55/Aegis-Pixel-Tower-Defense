  <rect x="9" y="3" width="3" height="3" fill="#38bdf8"/>
  <rect x="4" y="7" width="3" height="3" fill="#84cc16"/>
  <rect x="9" y="7" width="3" height="3" fill="#c084fc"/>
  <!-- Center Rift Core Crystal -->
  <rect x="7" y="4" width="2" height="6" fill="#fde047"/>
  <rect x="6" y="6" width="4" height="2" fill="#ffffff"/>
</svg>
