<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aegis Pixel TD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-void: #0c0e14;
        --bg-panel: #151924;
        --bg-card: #1d2332;
        --border-stone: #333d54;
        --border-gold: #e6b450;
        --text-main: #f0f4f8;
        --text-dim: #94a3b8;
        --accent-gold: #f59e0b;
        --accent-cyan: #38bdf8;
        --accent-emerald: #10b981;
        --accent-crimson: #ef4444;
        --accent-violet: #a855f7;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      body {
        background: var(--bg-void);
        color: var(--text-main);
        font-family: "Chakra Petch", sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        overflow-x: hidden;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #app-shell {
        width: 100%;
        max-width: 1180px;
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <div id="hud-top"></div>
      <div id="stage-layout" style="display: flex; gap: 12px; align-items: flex-start; justify-content: center; flex-wrap: wrap;">
        <div id="phaser-mount" style="border: 3px solid var(--border-stone); background: #090b10; box-shadow: 0 10px 30px rgba(0,0,0,0.65);"></div>
        <div id="hud-side" style="flex: 1; min-width: 320px; max-width: 380px;"></div>
      </div>
      <div id="hud-bottom"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
