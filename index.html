<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ELEMENTAL RIFT TD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      :root {
        --p-density: 1;
        --bg-void: #090d16;
        --bg-surface: #111827;
        --bg-elevated: #1a2336;
        --bg-interactive: #243049;
        --border-subtle: #2a3752;
        --border-strong: #47597a;
        --border-focus: #f59e0b;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --accent-amber: #f59e0b;
        --accent-sky: #38bdf8;
        --accent-emerald: #10b981;
        --accent-rose: #f43f5e;
        --accent-violet: #a855f7;
      }

      ::selection {
        background: var(--accent-amber);
        color: #090d16;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-void);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 4px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background: var(--bg-void);
        color: var(--text-primary);
        font-family: "Chakra Petch", sans-serif;
        min-height: 100vh;
        width: 100%;
        overflow-x: hidden;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      button, input {
        font-family: inherit;
      }

      button:focus-visible, input:focus-visible {
        outline: 2px solid var(--border-focus);
        outline-offset: 2px;
      }

      .num {
        font-family: "JetBrains Mono", monospace;
        font-variant-numeric: tabular-nums;
      }

      #app-shell {
        width: 100%;
        min-height: 100vh;
        padding: calc(10px * var(--p-density)) calc(18px * var(--p-density));
        display: flex;
        flex-direction: column;
        gap: calc(10px * var(--p-density));
      }

      .top-bar-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 10px 16px;
      }

      .top-brand-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .top-nav-strip {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .telemetry-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 8px 16px;
        margin-top: 8px;
      }

      .telemetry-stats-row {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 13px;
      }

      .wave-controls-strip {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      #stage-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 410px;
        gap: 14px;
        align-items: stretch;
        width: 100%;
        flex: 1;
      }

      #phaser-stage-wrap {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 580px;
      }

      #phaser-mount {
        width: 100%;
        height: 66vh;
        min-height: 540px;
        max-height: 780px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border-strong);
        background: #070a12;
        overflow: hidden;
      }

      #phaser-mount canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }

      .side-command-panel {
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        height: 100%;
      }

      .btn-touch {
        min-height: 38px;
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
        background: var(--bg-elevated);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 140ms cubic-bezier(0.22, 1, 0.36, 1), border-color 140ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .btn-touch:hover {
        background: var(--bg-interactive);
        border-color: var(--border-strong);
      }

      .loadout-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(175px, 1fr));
        gap: 10px;
        width: 100%;
      }

      html.modal-open,
      body.modal-open {
        overflow: hidden;
        height: 100%;
        max-height: 100dvh;
      }

      body.modal-open #app-shell {
        max-height: 100dvh;
        overflow: hidden;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(5, 8, 15, 0.84);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 1000;
      }

      .modal-dialog {
        width: 100%;
        max-width: 1120px;
        max-height: calc(100dvh - 32px);
        overflow-y: auto;
        background: var(--bg-surface);
        border: 1px solid var(--border-strong);
        border-radius: 14px;
        padding: 0 20px 20px 20px;
        display: block;
      }

      .modal-dialog > * + * {
        margin-top: 14px;
      }

      .modal-header-sticky {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--bg-surface);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        padding: 16px 0 12px 0;
        border-bottom: 1px solid var(--border-subtle);
      }

      .pixel-avatar {
        width: 44px;
        height: 44px;
        image-rendering: pixelated;
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        background: #0b111e;
        flex-shrink: 0;
      }

      @media (max-width: 1180px) {
        #stage-layout {
          grid-template-columns: 1fr;
        }
        #phaser-stage-wrap {
          min-height: auto;
        }
      }

      /* Mobile Portrait Zero-Scroll 100dvh Layout */
      @media (max-width: 768px) {
        #app-shell {
          height: 100dvh;
          max-height: 100dvh;
          min-height: 100dvh;
          overflow: hidden;
          padding: 6px 8px;
          gap: 6px;
          justify-content: space-between;
        }

        .top-bar-card {
          padding: 6px 10px;
          gap: 6px;
          border-radius: 8px;
        }

        .top-brand-row {
          width: 100%;
          justify-content: space-between;
          gap: 4px;
        }

        .top-brand-row h1 {
          font-size: 11px !important;
        }

        .top-nav-strip {
          width: 100%;
          flex-wrap: nowrap;
          overflow-x: auto;
          gap: 6px;
          padding-bottom: 2px;
          -webkit-overflow-scrolling: touch;
        }

        .top-nav-strip .btn-touch {
          min-height: 36px;
          padding: 4px 10px;
          font-size: 12px;
          flex-shrink: 0;
        }

        .telemetry-card {
          margin-top: 4px;
          padding: 6px 10px;
          gap: 6px;
          border-radius: 8px;
        }

        .telemetry-stats-row {
          width: 100%;
          justify-content: space-between;
          gap: 6px;
          font-size: 11px;
        }

        .mobile-hide-synergy {
          display: none !important;
        }

        .wave-controls-strip {
          width: 100%;
          flex-wrap: nowrap;
          overflow-x: auto;
          gap: 6px;
        }

        .wave-controls-strip .btn-touch {
          min-height: 36px;
          padding: 4px 10px;
          font-size: 12px;
          flex-shrink: 0;
        }

        #stage-layout {
          display: flex;
          flex-direction: column;
          gap: 6px;
          flex: 0 0 auto;
        }

        #phaser-stage-wrap {
          padding: 4px;
          border-radius: 8px;
          flex: 0 0 auto;
        }

        #phaser-mount {
          width: 100%;
          height: auto;
          min-height: 215px;
          max-height: 245px;
          aspect-ratio: 20 / 13;
        }

        .desktop-only-coord-grid {
          display: none !important;
        }

        .side-command-panel {
          padding: 8px 10px;
          gap: 6px;
          height: auto;
          border-radius: 8px;
        }

        .side-command-header {
          display: none !important;
        }

        .loadout-grid {
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          gap: 8px;
          padding-bottom: 2px;
          scroll-snap-type: x mandatory;
          -webkit-overflow-scrolling: touch;
        }

        .loadout-grid > div {
          min-width: 195px;
          padding: 8px 10px !important;
          scroll-snap-align: start;
          flex-shrink: 0;
        }

        .modal-backdrop {
          padding: 6px;
        }

        .modal-dialog {
          padding: 0 12px 12px 12px;
          max-height: calc(100dvh - 12px);
          border-radius: 10px;
        }

        .modal-header-sticky {
          padding: 12px 0 8px 0;
        }
      }

      /* Mobile Landscape Layout */
      @media (max-width: 920px) and (max-height: 500px) and (orientation: landscape) {
        #app-shell {
          height: auto;
          min-height: 100dvh;
          max-height: none;
          overflow-y: auto;
          padding: 6px 10px;
          gap: 6px;
        }
        .desktop-only-coord-grid,
        .side-command-header,
        .mobile-hide-synergy {
          display: none !important;
        }
        #stage-layout {
          display: grid;
          grid-template-columns: minmax(0, 1.35fr) minmax(250px, 1fr);
          gap: 8px;
          align-items: start;
        }
        #phaser-stage-wrap {
          padding: 4px;
          min-height: auto;
        }
        #phaser-mount {
          width: 100%;
          height: auto;
          min-height: 190px;
          max-height: 230px;
          aspect-ratio: 20 / 13;
        }
        .loadout-grid {
          display: flex;
          flex-wrap: nowrap;
          overflow-x: auto;
          gap: 6px;
        }
        .loadout-grid > div {
          min-width: 185px;
          padding: 6px 8px !important;
          flex-shrink: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-shell">
      <header id="hud-top"></header>
      <main id="stage-layout">
        <div id="phaser-stage-wrap">
          <div id="phaser-mount"></div>
        </div>
        <aside id="hud-side"></aside>
      </main>
      <section id="hud-bottom"></section>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
